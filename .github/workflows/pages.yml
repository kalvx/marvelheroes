name: Publish Marvel Heroes Compendium
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: marvel-heroes-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.repository == 'kalvx/marvelheroes'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy compendium
        id: deployment
        uses: actions/deploy-pages@v4
